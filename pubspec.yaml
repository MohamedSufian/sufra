name: sufra
description: "Sufra (سُفرة) - Gaza food delivery app"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2
  shared_preferences: ^2.5.5
  google_fonts: ^9.0.0
  intl: ^0.20.3
  flutter_animate: ^4.5.2
  shimmer: ^4.0.0
  material_ui: ^1.5.0
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  geolocator: ^14.1.1
  supabase_flutter: ^2.18.0
  share_plus: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  image: ^4.10.1

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/icon/
    # Bundled so text looks right offline from the first launch (google_fonts finds them by name).
    - assets/google_fonts/

# dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: assets/icon/app_icon.png
  adaptive_icon_background: "#FF5A36"
  adaptive_icon_foreground: assets/icon/app_icon_foreground.png
  web:
    generate: true
    image_path: assets/icon/app_icon.png
    background_color: "#D7401B"
    theme_color: "#D7401B"

# dart run flutter_native_splash:create
flutter_native_splash:
  color: "#D7401B"
  image: assets/icon/splash_logo.png
  android_12:
    color: "#D7401B"
    image: assets/icon/splash_logo_android12.png
  web: true
